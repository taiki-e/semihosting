name: CI

permissions: {}

on:
  pull_request:
  push:
    branches:
      - main
      - dev
  schedule:
    - cron: '0 2 * * 5'
  workflow_dispatch:

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_GIT_FETCH_WITH_CLI: true
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTDOCFLAGS: -D warnings
  RUSTFLAGS: -D warnings
  RUSTUP_MAX_RETRIES: 10
  SEMIHOSTING_DENY_WARNINGS: 1
  # NB: sync with miri/msrv/test/tidy jobs' --features option and package.metadata.docs.rs.features field in Cargo.toml
  TEST_FEATURES: alloc,stdio,fs,args,time,random

defaults:
  run:
    shell: bash --noprofile --norc -CeEuxo pipefail {0}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  tidy:
    uses: taiki-e/github-actions/.github/workflows/tidy.yml@af422d7af8ef63e0ea0d84510aff17254fef31c2 # 2026.11.23
    permissions:
      security-events: write # for github/codeql-action/*
    with:
      # We don't support x86_64, so use aarch64-unknown-linux-gnu instead.
      clippy-target: aarch64-unknown-linux-gnu,armv7-unknown-linux-gnueabihf,riscv64gc-unknown-linux-gnu,mips64-unknown-linux-gnuabi64,loongarch64-unknown-linux-gnu
      # NB: sync with env.TEST_FEATURES
      clippy-args: --features alloc,stdio,fs,args,time,random
      # TODO: workflow currently always runs doctest with the default target.
      clippy-doctest: false
      check-external-types: false # TODO: remove once new version of https://github.com/awslabs/cargo-check-external-types with latest rustdoc-types released
  codegen:
    needs: tidy
    uses: taiki-e/github-actions/.github/workflows/gen.yml@af422d7af8ef63e0ea0d84510aff17254fef31c2 # 2026.11.23
    permissions:
      contents: write # for creating branch for pr
      pull-requests: read # for gh pr list
    secrets:
      PR_TOKEN_APP_PRIVATE_KEY: ${{ secrets.PR_TOKEN_APP_PRIVATE_KEY }}
  # We have some platform-independent code, so test them.
  test:
    needs: tidy
    uses: taiki-e/github-actions/.github/workflows/rust-test.yml@af422d7af8ef63e0ea0d84510aff17254fef31c2 # 2026.11.23
    permissions:
      security-events: write # for github/codeql-action/*
    with:
      # We don't support x86_64, so use aarch64-unknown-linux-gnu instead.
      target: aarch64-unknown-linux-gnu,mips64-unknown-linux-gnuabi64
      # NB: sync with env.TEST_FEATURES
      features: --features alloc,stdio,fs,args,time,random
      optional-deps: ''
      build-args: --depth 2 --exclude-features panic-unwind,backtrace,trap-hlt,openocd-semihosting
      no-std: false # covered by no-std job
      miri-target: aarch64-unknown-linux-gnu
      # NB: sync with env.TEST_FEATURES
      miri-args: --features alloc,stdio,fs,args,time,random
      msrv-target: aarch64-unknown-linux-gnu,armv7-unknown-linux-gnueabihf,riscv64gc-unknown-linux-gnu
      # NB: sync with env.TEST_FEATURES
      msrv-args: --features alloc,stdio,fs,args,time,random

  no-std:
    needs: tidy
    strategy:
      fail-fast: false
      matrix:
        include:
          - rust: '1.64' # LLVM 14
          # - rust: '1.69' # LLVM 15
          # - rust: '1.72' # LLVM 16
          # - rust: '1.77' # LLVM 17
          # - rust: '1.81' # LLVM 18
          - rust: '1.83' # LLVM 19
          # - rust: '1.86' # LLVM 19
          # - rust: '1.90' # LLVM 20
          - rust: stable
          - rust: beta
          - rust: nightly
          # The behavior of semihosting somewhat depends on the behavior of the host system.
          - rust: nightly
            os: ubuntu-24.04-arm
          - rust: nightly
            os: macos-latest
          - rust: nightly
            os: windows-latest
    runs-on: ${{ matrix.os || 'ubuntu-24.04' }}
    timeout-minutes: 60
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2
      - uses: taiki-e/github-actions/free-device-space@af422d7af8ef63e0ea0d84510aff17254fef31c2 # 2026.11.23
        if: startsWith(matrix.os, 'ubuntu') || matrix.os == ''
      - uses: taiki-e/install-action@76c2e6406e52637deed7160d77bded76bd83e06e # v2.87.14
        with:
          tool: rust@${{ matrix.rust }}${{ (matrix.rust == 'stable' && (startsWith(matrix.os, 'ubuntu') || matrix.os == '')) && ',espup' || '' }}
          fallback: none
      - run: |
          retry() {
            for i in {1..10}; do
              if "$@"; then
                return 0
              else
                sleep "${i}"
              fi
            done
            "$@"
          }
          if [[ "${RUST}" == "stable" ]]; then
            retry espup install --targets esp32
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUST: ${{ matrix.rust }}
        if: startsWith(matrix.os, 'ubuntu') || matrix.os == ''
      - run: |
          retry() {
            for i in {1..10}; do
              if "$@"; then
                return 0
              else
                sleep "${i}"
              fi
            done
            "$@"
          }
          qemu_version=11.1.3-patched.0
          qemu_dir="${RUNNER_TEMP}"/qemu
          mkdir -p -- "${qemu_dir}/bin"
          printf '%s/bin\n' "${qemu_dir}" >>"${GITHUB_PATH}"
          case "${OS}" in
            macos*) host=aarch64-macos ;;
            windows*)
              host=x86_64-windows
              sudo() { "$@"; }
              ;;
            *-arm) host=aarch64-linux ;;
            *) host=x86_64-linux ;;
          esac
          retry curl --proto '=https' --tlsv1.2 -fsSL --retry 10 "https://github.com/taiki-e/qemu/releases/download/v${qemu_version}/qemu-system-${host}.tar.zst" \
            | tar xf - --zstd
          sudo cp -r -- qemu/. "${qemu_dir}"/
          rm -rf -- ./qemu
          # Patched QEMU for LoongArch semihosting
          printf 'LOONGARCH_QEMU_BIN_DIR=%s/bin\n' "${qemu_dir}" >>"${GITHUB_ENV}"
          if [[ "${host}" == *'-linux' ]]; then
            retry curl --proto '=https' --tlsv1.2 -fsSL --retry 10 "https://github.com/taiki-e/qemu/releases/download/v${qemu_version}/qemu-user-${host}.tar.zst" \
              | tar xf - --zstd
            sudo mv -- qemu-user/bin/qemu-* "${qemu_dir}"/bin/
            rm -rf -- ./qemu-user
            llvm_version=$(rustc -vV | { grep -E '^LLVM version:' || true; } | cut -d' ' -f3)
            llvm_version="${llvm_version%%.*}"
            if [[ "${llvm_version}" -lt 17 ]]; then
              # pre-17 LLD doesn't support big-endian Arm
              apt_packages=(binutils-arm-none-eabi)
              retry sudo apt-get -o Acquire::Retries=10 -qq update
              retry sudo apt-get -o Acquire::Retries=10 -o Dpkg::Use-Pty=0 install -y --no-install-recommends "${apt_packages[@]}"
            fi
          fi
        env:
          OS: ${{ matrix.os || 'ubuntu-24.04' }}
      # Avoid needless git fetch
      - run: sed -Ei '/^unwinding = .*/d' Cargo.toml
        working-directory: tests/no-std
        if: matrix.rust != 'nightly'
      - run: tools/no-std.sh
        env:
          ALL_TARGETS_MUST_BE_AVAILABLE: ${{ matrix.rust == 'nightly' || '' }}
      - run: TEST_RUNNER=qemu-user tools/no-std.sh
        if: startsWith(matrix.os, 'ubuntu') || matrix.os == ''
      - run: cargo +esp build --target xtensa-esp32-none-elf -Z build-std=core,alloc --features "${TEST_FEATURES},openocd-semihosting"
        if: matrix.rust == 'stable' && (startsWith(matrix.os, 'ubuntu') || matrix.os == '')
